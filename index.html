<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>The Braz Games</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f6c85f'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="portal.css?v=2026-06-28-portal-1">
  </head>
  <body>
    <main class="portal-shell" aria-labelledby="portalTitle">
      <h1 id="portalTitle"><span>The Braz</span> <span>Games</span></h1>

      <nav class="game-grid" aria-label="Game selection">
        <a
          class="game-card game-card-memory"
          href="games/memory/"
          aria-label="Open game number 1, זיכרון בסלון"
        >
          <span class="game-number">#1</span>
          <span class="game-name" lang="he" dir="rtl">זיכרון בסלון</span>
        </a>

        <a
          class="game-card game-card-submarine"
          href="games/submarine/"
          aria-label="Open game number 2, צוללות חמקמקות"
        >
          <span class="game-number">#2</span>
          <span class="game-name" lang="he" dir="rtl">צוללות חמקמקות</span>
        </a>

        <a
          class="game-card game-card-dino"
          href="games/dino/"
          aria-label="Open game number 3, הבריחה מבאר שבע"
        >
          <span class="game-number">#3</span>
          <span class="game-name" lang="he" dir="rtl">הבריחה מבאר שבע</span>
        </a>

        <a
          class="game-card game-card-brazio"
          href="games/super-brazio/"
          aria-label="Open game number 4, SUPER BRAZIO"
        >
          <span class="game-number">#4</span>
          <span class="game-name">SUPER BRAZIO</span>
        </a>
      </nav>
    </main>
    <script>
      (() => {
        const PORTAL_FRESH_START_PREFIX = "the-braz-games:fresh-start:";
        const normalizePath = (pathname) => pathname.replace(/\/+$/, "");

        const markFreshStart = (link) => {
          try {
            const targetUrl = new URL(link.getAttribute("href"), window.location.href);
            sessionStorage.setItem(`${PORTAL_FRESH_START_PREFIX}${normalizePath(targetUrl.pathname)}`, "1");
          } catch {
            // If sessionStorage is blocked, the clean game link still works as a normal direct entry.
          }
        };

        document.querySelectorAll('a[href^="games/"]').forEach((link) => {
          link.addEventListener("pointerdown", () => markFreshStart(link));
          link.addEventListener("click", () => markFreshStart(link));
          link.addEventListener("keydown", (event) => {
            if (event.key !== "Enter" && event.key !== " ") return;
            markFreshStart(link);
          });
        });
      })();
    </script>
  </body>
</html>
