<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Super Brazio placeholder opening background">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#17101f"/>
      <stop offset="0.42" stop-color="#241837"/>
      <stop offset="1" stop-color="#11251b"/>
