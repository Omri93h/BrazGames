name: Static validation

on:
  push:
    branches:
      - main
      - gh-pages
  pull_request:

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate local static references
        run: python3 tools/validate-static-site.py
